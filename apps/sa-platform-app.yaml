apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/FirstOrderGT/Practica8-SA-B-202307470.git'
    path: helm/sa-platform
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true