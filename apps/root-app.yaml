apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/FirstOrderGT/Practica8-SA-B-202307470.git'
    path: apps
    targetRevision: HEAD
    directory:
      recurse: true
      exclude: 'root-app.yaml' # Excluye a sí misma para evitar bucles
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true