apiVersion: v2
name: sa-platform
description: Plataforma empresarial de microservicios para la Tienda de Juguetes
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "15.5.24"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: rabbitmq
    version: "14.6.4"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: rabbitmq.enabled

  - name: api-gateway
    version: 1.0.0
    repository: "file://charts/api-gateway"
  - name: auth-service
    version: 1.0.0
    repository: "file://charts/auth-service"
  - name: authz-service
    version: 1.0.0
    repository: "file://charts/authz-service"
  - name: cart-service
    version: 1.0.0
    repository: "file://charts/cart-service"
  - name: frontend
    version: 1.0.0
    repository: "file://charts/frontend"
  - name: orders-service
    version: 1.0.0
    repository: "file://charts/orders-service"
  - name: products-service
    version: 1.0.0
    repository: "file://charts/products-service"
  - name: reviews-service
    version: 1.0.0
    repository: "file://charts/reviews-service"