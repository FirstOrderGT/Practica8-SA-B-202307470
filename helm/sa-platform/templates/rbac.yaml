apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-sa
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-role
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-rolebinding
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: cronjob-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: cronjob-role
  apiGroup: rbac.authorization.k8s.io