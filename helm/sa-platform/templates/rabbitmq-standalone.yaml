apiVersion: apps/v1
kind: Deployment
metadata:
  name: sa-platform-rabbitmq
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "rabbit_admin"
            - name: RABBITMQ_DEFAULT_PASS
              value: "rabbit_secure_password_123"
---
apiVersion: v1
kind: Service
metadata:
  name: sa-platform-rabbitmq
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app.kubernetes.io/name: rabbitmq