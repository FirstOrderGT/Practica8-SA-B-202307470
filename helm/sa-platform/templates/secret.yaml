apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.fullname" . }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.postgresql.auth.username | default "postgres" | quote }}
  DB_PASS: {{ required "postgresql.auth.password es requerido" .Values.postgresql.auth.password | quote }}
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | default "user" | quote }}
  RABBITMQ_PASS: {{ required "rabbitmq.auth.password es requerido" .Values.rabbitmq.auth.password | quote }}
  JWT_SECRET: {{ required "global.jwtSecret es requerido" .Values.global.jwtSecret | quote }}
  AES_SECRET: {{ required "global.aesSecret es requerido" .Values.global.aesSecret | quote }}